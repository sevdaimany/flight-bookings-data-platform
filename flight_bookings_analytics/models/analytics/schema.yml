version: 2
models:
    - name: airports_revenue
      description: "This model calculates the total revenue generated by each airport based on flight bookings."
      columns:
        - name: country
          description: "The country where the airport is located."
          data_tests:
            - not_null
            - unique
        - name: total_revenue
          description: "The total revenue generated by the airport from flight bookings."
          data_tests:
            - not_null

        - name: total_bookings
          description: "The total number of bookings associated with the airport."
          data_tests:
            - not_null
        - name: average_booking_amount
          description: "The average amount spent per booking at the airport."
          data_tests:
            - not_null
    
    - name: passenger_analytics
      description: "This model provides analytics on passengers, including total bookings, total spent, and average booking amount."
      columns:
        - name: passenger_id
          description: "The unique identifier for each passenger."
        - name: name
          description: "The name of the passenger."
        - name: total_bookings
          description: "The total number of bookings made by the passenger."
        - name: total_spent
          description: "The total amount spent by the passenger on bookings."
        - name: average_booking_amount
          description: "The average amount spent per booking by the passenger."